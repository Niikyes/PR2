name: Deploy to EC2

on:
  push:
    branches:
      - test1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Instalar docker-compose si no existe
            if ! command -v docker-compose &> /dev/null; then
              sudo apt update
              sudo apt install -y docker-compose
            fi

            # Verificar que el directorio PR2 y el archivo .env existen
            if [ ! -d "/home/ubuntu/PR2" ]; then
              echo "ERROR: El directorio /home/ubuntu/PR2 no existe en la instancia EC2."
              exit 1
            fi

            if [ ! -f "/home/ubuntu/PR2/backend/.env" ]; then
              echo "ERROR: El archivo /backend/.env no existe en /home/ubuntu/PR2."
              exit 1
            fi

            # Entrar al directorio del proyecto
            cd ~/PR2

            # Detener y eliminar contenedores anteriores
            sudo docker-compose down --rmi all --volumes --remove-orphans || true

            # Descargar imágenes actualizadas y levantar contenedores
            sudo docker-compose --env-file backend/.env pull
            sudo docker-compose --env-file backend/.env up -d


 
