name: Deploy to EC2

on:
  push:
    branches:
      - test1 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1️⃣ Instalar docker-compose si no está
            if ! command -v docker-compose &> /dev/null; then
              sudo apt update
              sudo apt install -y docker-compose
            fi

            # 2️⃣ Asegurar directorio del proyecto
            mkdir -p ~/PR2/backend

            # 3️⃣ Crear archivo .env dinámicamente en EC2
            cat <<EOF > ~/PR2/backend/.env
            PORT=8080
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            EOF

            # 4️⃣ Ir a PR2 y levantar contenedores
            cd ~/PR2
            sudo docker-compose down --rmi all --volumes --remove-orphans || true
            sudo docker-compose --env-file backend/.env pull
            sudo docker-compose --env-file backend/.env up -d





 
