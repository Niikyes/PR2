name: CI/CD to EC2

on:
  push:
    branches: ["test1"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Instalar docker-compose si no existe
            if ! command -v docker-compose &> /dev/null
            then
              sudo apt update
              sudo apt install -y docker-compose
            fi

            # Descargar el repo en EC2 (solo para usar el docker-compose.yml)
            rm -rf ~/PR2
            git clone https://github.com/${GITHUB_REPOSITORY}.git ~/PR2

            # Exportar variables desde Secrets
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export DB_NAME=${{ secrets.DB_NAME }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            # Ir al repo y desplegar con el docker-compose del repo
            cd ~/PR2
            sudo docker-compose down --rmi all --volumes --remove-orphans || true
            sudo docker-compose pull
            sudo docker-compose up -d




